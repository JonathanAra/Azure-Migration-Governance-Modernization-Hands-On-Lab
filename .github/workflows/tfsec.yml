name: tfsec

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          # Set this to true at first so you can see findings without failing the build.
          soft_fail: true
